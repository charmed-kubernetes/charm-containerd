version = 3
root = "/var/lib/containerd"
state = "/run/containerd"
oom_score = 0

[grpc]
  address = "/run/containerd/containerd.sock"
  uid = 0
  gid = 0
  max_recv_message_size = 16777216
  max_send_message_size = 16777216

[debug]
  address = ""
  uid = 0
  gid = 0
  level = ""

[metrics]
  address = ""
  grpc_histogram = false

[cgroup]
  path = ""

[plugins]
  [plugins."io.containerd.monitor.task.v1.cgroups"]
    no_prometheus = false
  [plugins."io.containerd.cri.v1.images"]
    stats_collect_period = 10
    [plugins."io.containerd.cri.v1.images".pinned_images]
      sandbox = "{{ sandbox_image }}"
    [plugins."io.containerd.cri.v1.images".registry]
      config_path = "/etc/containerd/certs.d"
      {#- registry.configs.*.auth is deprecated but still supported. #}
      {%- for registry in custom_registries %}
      {%- if registry.username and registry.password %}
      [plugins."io.containerd.cri.v1.images".registry.configs."{{ registry.url_host }}".auth]
        username = "{{ registry.username }}"
        {%- if registry.password is mapping %}
        password = '{{ registry.password | tojson }}'
        {%- else %}
        password = "{{ registry.password }}"
        {%- endif %}
      {%- endif %}
      {%- endfor %}
  [plugins."io.containerd.cri.v1.runtime"]
    enable_selinux = false
    max_container_log_line_size = 16384
    [plugins."io.containerd.cri.v1.runtime".containerd]
      {%- if runtime.lower() != "runc" %}
      default_runtime_name = "{{ runtime }}"
      {%- endif %}
      [plugins."io.containerd.cri.v1.runtime".containerd.runtimes]
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc]
          runtime_type = "{{ runtime_type }}"
          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc.options]
            SystemdCgroup = false
        {%- if untrusted %}
        {#- io.kubernetes.cri.untrusted-workload annotations may select this handler. #}
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.untrusted]
          runtime_type = "io.containerd.{{ untrusted_name }}.v2"
        {%- if untrusted_name != "untrusted" %}
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.{{ untrusted_name }}]
          runtime_type = "io.containerd.{{ untrusted_name }}.v2"
        {%- endif %}
        {%- endif %}
        {%- if "nvidia" in runtime %}
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.{{ runtime }}]
          privileged_without_host_devices = false
          runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.{{ runtime }}.options]
            BinaryName = "/usr/bin/{{ runtime }}"
            SystemdCgroup = false
        {%- endif %}
    [plugins."io.containerd.cri.v1.runtime".cni]
      bin_dirs = ["/opt/cni/bin"]
      conf_dir = "/etc/cni/net.d"
      conf_template = ""
  [plugins."io.containerd.grpc.v1.cri"]
    stream_server_address = "127.0.0.1"
    stream_server_port = "0"
    enable_tls_streaming = false
    [plugins."io.containerd.grpc.v1.cri".x509_key_pair_streaming]
      tls_cert_file = ""
      tls_key_file = ""
  [plugins."io.containerd.service.v1.diff-service"]
    default = ["walking"]
  [plugins."io.containerd.internal.v1.opt"]
    path = "/opt/containerd"
  [plugins."io.containerd.monitor.container.v1.restart"]
    interval = "10s"
  [plugins."io.containerd.gc.v1.scheduler"]
    pause_threshold = 0.02
    deletion_threshold = 0
    mutation_threshold = 100
    schedule_delay = "0s"
    startup_delay = "100ms"
